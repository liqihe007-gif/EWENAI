name: Build YiWenAI APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Reassemble source archive
        run: |
          cat archive.part* > source.zip.b64
          base64 -d source.zip.b64 > source.zip
          unzip -q source.zip
      - name: Test and build
        working-directory: YiWenAI
        run: |
          gradle testDebugUnitTest
          gradle assembleDebug
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YiWenAI-Android-APK
          path: |
            YiWenAI/app/build/outputs/apk/debug/app-debug.apk
            YiWenAI/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 30
